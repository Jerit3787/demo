<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog Application</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <h1>My Blog Application</h1>
    <div class="card">
        <form id="add-blog-form" method="post">
            <input type="text" id="title" name="title" placeholder="Enter blog title" required>
            <textarea id="content" name="content" placeholder="Enter blog content" row="10" cols="10" required></textarea>
            <input type="submit" id="submit-button" value="Add Blog Post">
        </form>
    </div>
    <div class="blogs">
    </div>
    <script src="script.js"></script>
</body>

</html>
